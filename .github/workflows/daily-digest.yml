name: AI Daily Digest

on:
  schedule:
    # UTC 00:10 = 北京时间 08:10
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      ignore_same_day_cooldown:
        description: Regenerate the full daily ranking instead of rotating same-day articles
        required: false
        type: boolean
        default: true
      generic_mode:
        description: Use config policy, include generic intelligence, or show project intelligence only
        required: false
        type: choice
        default: config
        options:
          - config
          - include
          - project-only

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      rsshub:
        image: diygod/rsshub:latest
        ports:
          - 1200:1200
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.X_CT0 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Wait for RSSHub to be ready
        run: |
          echo "Waiting for RSSHub..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:1200/ > /dev/null 2>&1; then
              echo "RSSHub is ready!"
              break
            fi
            sleep 2
          done

      - name: Generate daily digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_BASE: https://api.deepseek.com/v1
          OPENAI_MODEL: deepseek-v4-flash
          AI_PRIMARY_PROVIDER: openai
          AI_REQUEST_TIMEOUT_MS: 180000
          DEEPSEEK_THINKING_TASKS: project-scoring,highlights
          DIGEST_IGNORE_SAME_DAY_COOLDOWN: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_same_day_cooldown }}
          DIGEST_GENERIC_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.generic_mode || 'config' }}
          RSSHUB_BASE_URL: http://localhost:1200
          X_ACCOUNTS: ${{ vars.X_ACCOUNTS || 'grok,xingpt,FinanceYF5,sodawhite_dev,yetone,runes_leo,abskoop,egeberkina,vasuman,eptwts,EXM7777,steipete,rileybrown,yangyi,manateelazycat,lifesinger,yuxiyou,gregisenberg,oran_ge,LangChain,OpenAI,AnthropicAI,Khazix0918,dotey,deepseek_ai,_akhaliq,DrJimFan,hardmaru,LumaLabsAI,huggingface' }}
        run: |
          mkdir -p digests
          bun scripts/digest.ts \
            --hours 24 \
            --top-n 15 \
            --lang zh \
            --output "digests/digest-$(TZ=Asia/Shanghai date +%Y%m%d).md"

      - name: Commit and push digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --staged --quiet; then
            echo "No new digest to commit"
          else
            git commit -m "📰 Daily digest $(TZ=Asia/Shanghai date +%Y-%m-%d)"
            git push
          fi

      - name: Push to WeChat via ServerChan
        if: success()
        run: |
          DIGEST_FILE="digests/digest-$(TZ=Asia/Shanghai date +%Y%m%d).md"
          if [ ! -f "$DIGEST_FILE" ]; then
            echo "No digest file found, skipping push"
            exit 0
          fi

          # Keep the existing generic excerpt, then append a compact project status.
          TITLE="📰 AI 每日精选 $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          DESP=$(awk '
            /^## 📝 今日看点/{found=1; next}
            /^## 🏆 今日必读/{found=1; next}
            /^## 📊 数据概览/{exit}
            found{print}
          ' "$DIGEST_FILE" | head -80)

          PROJECT_SUMMARY=$(awk '
            /^## 🎯 项目相关情报/{projects=1; next}
            projects && /^---$/{exit}
            projects && /^### /{print; next}
            projects && /^#### /{sub(/^#### /, "- "); print; next}
            projects && /^> 暂无达到质量门槛的项目相关情报。/{print; next}
          ' "$DIGEST_FILE")

          if [ -n "$PROJECT_SUMMARY" ]; then
            DESP="${DESP}

          ## 🎯 项目相关情报

          ${PROJECT_SUMMARY}"
          fi

          DESP="${DESP}

          ---
          [📄 查看完整日报](https://github.com/${{ github.repository }}/blob/main/${DIGEST_FILE})"

          curl -sf "https://sctapi.ftqq.com/${{ secrets.SERVERCHAN_KEY }}.send" \
            -d "title=${TITLE}" \
            --data-urlencode "desp=${DESP}" \
            > /dev/null 2>&1 && echo "WeChat push sent!" || echo "WeChat push failed"
            
      - name: Push to Feishu
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: |
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "FEISHU_WEBHOOK_URL is not configured, skipping Feishu push"
            exit 0
          fi

          DIGEST_FILE="digests/digest-$(TZ=Asia/Shanghai date +%Y%m%d).md"

          if [ ! -f "$DIGEST_FILE" ]; then
            echo "No digest file found, skipping Feishu push"
            exit 0
          fi

          TITLE="AI日报｜AI 每日精选 $(TZ=Asia/Shanghai date +%Y-%m-%d)"

          SUMMARY=$(awk '
            /^## 📝 今日看点/{found=1}
            /^## 📊 数据概览/{exit}
            found{print}
          ' "$DIGEST_FILE" | head -60)

          PROJECT_SUMMARY=$(awk '
            /^## 🎯 项目相关情报/{projects=1; next}
            projects && /^---$/{exit}
            projects && /^### /{print; next}
            projects && /^#### /{sub(/^#### /, "- "); print; next}
            projects && /^> 暂无达到质量门槛的项目相关情报。/{print; next}
          ' "$DIGEST_FILE")

          if [ -n "$PROJECT_SUMMARY" ]; then
            SUMMARY="${SUMMARY}

          ## 🎯 项目相关情报

          ${PROJECT_SUMMARY}"
          fi

          DIGEST_URL="https://github.com/${{ github.repository }}/blob/main/${DIGEST_FILE}"

          TEXT=$(printf '%s\n\n%s\n\n完整日报：%s' \
            "$TITLE" \
            "$SUMMARY" \
            "$DIGEST_URL")

          PAYLOAD=$(TEXT="$TEXT" bun -e '
            process.stdout.write(JSON.stringify({
              msg_type: "text",
              content: {
                text: process.env.TEXT || ""
              }
            }))
          ')

          echo "Sending digest to Feishu..."

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD" \
            "$FEISHU_WEBHOOK_URL"

          echo ""
          echo "Feishu push request completed"
